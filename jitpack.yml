# JitPack build: pin JDK 21 and publish :lang to the local Maven repo.
#
# We install Gradle via SDKMAN and call `gradle` directly instead of ./gradlew.
# On the JitPack build image the project wrapper does not launch
# ("Could not find or load main class org.gradle.wrapper.GradleWrapperMain"),
# even though a clean checkout of the tag runs the wrapper fine everywhere else.
# Using a provided Gradle sidesteps that. Keep the version in sync with
# gradle/wrapper/gradle-wrapper.properties (gradle-9.2.0).
jdk:
  - openjdk21
install:
  - sdk install gradle 9.2.0 || true
  - sdk use gradle 9.2.0 || true
  - gradle :lang:publishToMavenLocal -x test --no-daemon
